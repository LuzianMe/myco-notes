name: demo
# Builds the made-up "Greenhouse Sensors" notes tree with this kit and publishes its map and mycelium view on GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["skills/**", "examples/demo/**", ".github/workflows/demo.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the demo tree and its map
        run: python examples/demo/build_demo.py "$RUNNER_TEMP/demo"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/demo/myco-notes/map
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
