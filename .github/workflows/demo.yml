name: demo
# Builds the made-up "Greenhouse Sensors" notes repository with this kit and publishes its map and mycelium view on GitHub Pages,
# with a public graph (build-notes-map.py --public), embed.html (an example of a website embedding it) and the wiki layout under /wiki/.
on:
  push:
    branches: [main]
    paths: ["skills/**", "examples/demo/**", ".github/workflows/demo.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The markdown package (the maps render the notes with it)
        run: pip install markdown
      - name: Build the demo notes and its map
        run: python examples/demo/build_demo.py "$RUNNER_TEMP/demo"
      - name: The site, with a public graph and the embedding example (embed.html)
        run: |
          cp -r "$RUNNER_TEMP/demo/myco-notes/map" "$RUNNER_TEMP/site"
          python "$RUNNER_TEMP/demo/myco-notes/tools/build-notes-map.py" --root "$RUNNER_TEMP/demo" --public \
            --labels examples/demo/public-labels.json --out "$RUNNER_TEMP/site/public"
          cp examples/demo/embed.html "$RUNNER_TEMP/site/embed.html"
          python "$RUNNER_TEMP/demo/myco-notes/tools/build-notes-map.py" --root "$RUNNER_TEMP/demo" --layout wiki --out "$RUNNER_TEMP/site/wiki"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
