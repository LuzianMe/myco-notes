name: test
on:
  push:
    branches: [main]   # a pull request is tested through pull_request; a push to its branch would test it twice
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity for the test commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Native test (no bash; real launchers; Linux, macOS and Windows; the content checks on Linux only)
        run: python tests/native.py ${{ runner.os != 'Linux' && '--platform' || '' }}
      - name: Behaviour self-test (each scenario's reference actions pass, a typical mistake is caught)
        if: runner.os == 'Linux'
        run: python tests/behaviour/run.py
      - name: Wiki layout of the map (links, theme, search data, fallback without the markdown package)
        if: runner.os == 'Linux'
        run: pip install markdown && python tests/wiki.py
      - name: Release check (the four version fields agree, CHANGELOG.md has their section)
        run: python scripts/release.py --check
      - name: Smoke test (bash)
        if: runner.os != 'Windows'
        run: bash tests/smoke.sh
      - name: Launchers typed the way users type them (PowerShell and cmd)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location skills/myco-notes
          $o = (& .\tools\notes-commit --help) | Out-String
          if ($o -notmatch '--branch') { throw "PowerShell: .\tools\notes-commit did not run" }
          $o = (cmd /c "tools\notes-commit --help") | Out-String
          if ($o -notmatch '--branch') { throw "cmd: tools\notes-commit did not run" }
          $o = (& .\tools\bootstrap --help) | Out-String
          if ($o -notmatch 'target') { throw "PowerShell: .\tools\bootstrap did not run" }
          "launchers OK in PowerShell and cmd"
  oldest-python:
    # The tools promise Python 3.8+; run both tests on the oldest version so a newer-only feature cannot slip in.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Git identity for the test commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Native test on Python 3.8
        run: python tests/native.py
      - name: Wiki layout test on Python 3.8
        run: pip install markdown && python tests/wiki.py
      - name: Smoke test on Python 3.8
        run: |
          mkdir -p "$RUNNER_TEMP/py38" && ln -sf "$(command -v python)" "$RUNNER_TEMP/py38/python3"
          PATH="$RUNNER_TEMP/py38:$PATH" bash tests/smoke.sh
  browser:
    # The mycelium view in a real browser (tests/browser.py): a page opened with no size, embed mode, the host page's messages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity for the demo commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: pip install playwright==1.65.2 markdown && python -m playwright install --with-deps chromium
      - run: python tests/browser.py
  pyflakes:
    # Unused imports, undefined names and similar mistakes in the tools, the tests and the demo builder.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes==3.2.0
      - run: python -m pyflakes skills/myco-notes/tools/*.py tests/*.py tests/behaviour/*.py examples/demo/*.py .github/assets/*.py scripts/*.py
