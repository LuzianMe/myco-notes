<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="How Myco Notes works. What you give: changes, quick thoughts, questions, links and manuals, decisions. The method: check the real system before writing; one home per fact; evidence and dates; supersede, never delete; no secrets, ever; nothing changes without your yes. What you get: notes that are true, answers with their source, a briefing every session, any past date, a map of what connects, nothing leaked or lost. Session after session: you work or ask, the agent checks it live, writes it to the right note, it is checked and committed, and the next session starts from what is true; now and then a review proposes fixes and you decide.">
