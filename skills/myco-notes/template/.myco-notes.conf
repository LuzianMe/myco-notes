# Myco Notes configuration (shell syntax, read by the tools: notes-commit, mirror-push, notes-lint, build-notes-map, ...)

# Folder layout (relative to the repository root). MYCO_DIR is the one folder that holds the notes, tools, docs and map, so the root
# stays free for the project's own folders. Empty MYCO_DIR = the older flat layout (notes/, tools/, docs/, notes-map/ at the root).
# The next four lines are what the tools use; rename a folder by changing its line and moving the folder (tools/relocate can do it).
MYCO_DIR={{MYCO_DIR}}
NOTES_DIR={{NOTES_DIR}}
TOOLS_DIR={{TOOLS_DIR}}
DOCS_DIR={{DOCS_DIR}}
MAP_DIR={{MAP_DIR}}

# Project data folders (inputs, outputs, attachments): not notes. Space separated. The lint and the map leave them out; bootstrap
# --data-dir also adds them to .gitignore. The secret scan still checks anything that does get committed.
DATA_DIRS="{{DATA_DIRS}}"

# Records inside the notes folder that are not re-checked for passed follow-up dates, missing references, size or orphans
# (the secret check still applies). Space separated, relative to the notes folder.
HISTORY_DIRS="archive logs"

# Size limits for the lint (KB). A note over MAX_NOTE_KB should be split; AGENTS.md warns from ENTRY_WARN_KB because Codex and
# some other agents load only the first 32 KiB of instructions.
MAX_NOTE_KB=100
ENTRY_WARN_KB=24

# Line added to commits made by an AI agent (omit with: notes-commit --human). Leave empty for none.
AGENT_TRAILER=""
# Example: AGENT_TRAILER="Co-Authored-By: Your Agent <noreply@example.com>"

# Files whose live copy must equal the committed copy. When any file matching these globs is part of a commit,
# SYNC_CMD runs after the commit (for example a script that copies them to the server that runs them).
SYNC_GLOBS=""
SYNC_CMD=""
# Example: SYNC_GLOBS="{{NOTES_DIR}}/scripts/health.sh {{NOTES_DIR}}/scripts/report.sh"  SYNC_CMD="{{TOOLS_DIR}}/sync-scripts.sh"

# Syntax checks run before a commit on changed files with these extensions (bash -n for sh, python -m py_compile for py).
CHECK_SH=1
CHECK_PY=1

# mirror-push: where to mirror this repository. Empty = not configured. Forms: a local directory (/path or C:\path),
# git:URL (git push --mirror to any git remote or bare repository; no rsync needed), or user@host:/path (needs ssh and rsync).
MIRROR_TARGET=""
# Commands to run after a successful mirror (for example rebuild/publish the notes map). One per line, run with bash
# (on Windows with cmd.exe).
POST_PUSH_CMDS=""

# Extra regular expressions (ERE, one per line in the file named here) that the secret scan should NOT flag.
SECRET_ALLOW_FILE=.myco-notes-secret-allow
