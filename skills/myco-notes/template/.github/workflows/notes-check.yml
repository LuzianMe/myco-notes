# Checks every change to the notes: secret scan of the added lines + notes-lint ({{TOOLS_DIR}}/ci-check).
# Make the check named "notes-check" (this job) a required status check in the branch protection of main (see {{DOCS_DIR}}/TEAM.md).
# GitHub Enterprise Server: use a runner label your instance has, and make sure actions/checkout is available to it.
name: notes-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  notes-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan and lint
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash {{TOOLS_DIR}}/ci-check "$BASE_SHA"
