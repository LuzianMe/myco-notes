/* the quiet threads are drawn into this second canvas, a layer under the main one (#t), and reused until something changes (the
   view, the layout, the focus, the theme); while the network turns by itself they are redrawn about 20 times a second, the notes on
   top every frame. A layer of its own means the browser composes the two, and no full-screen copy is made in every frame. */
var tc=document.getElementById("t"),tcx=tc.getContext("2d"),gc=document.createElement("canvas"),gcx=gc.getContext("2d"),tKey="",tLast=0,busyNow=false,tcache={},spikes=[],ambT=0;   /* gc: the threads' glow at quarter resolution (soft, and a sixteenth of the pixels) */

/* the method's record and reference groups get quiet colours, so the vivid ones go to the read order, the plans and the project's own areas */

(function(){var v=0,q=0;D.groups.forEach(function(g,i){GCI[i]=QUIET[g.id]?[1,q++]:[0,v++]})})();

/* The theme is set on <html> before the first paint (the script in <head>); no attribute means Auto: light when the system asks

/* ---------- model ---------- */

});

  /* dir: 1 = a mentions b, -1 = b mentions a, 0 = they mention each other */
  var a=NODES[e[0]],b=NODES[e[1]],o={a:a,b:b,w:e[2]+e[3],k:k,off:(hash(k)-.5)*.34,dir:e[2]&&e[3]?0:e[2]?1:-1};

var hov=-1,sel=-1,match=null,alpha=1,playing=false,acc=0,ripples=[];
var cam={x:0,y:0,k:1,tx:0,ty:0,tk:1},autoFit=true,W=0,H=0,DPR=1,lastT=0,VS=1,DPRCAP=EMBED?1.5:2,slowT=0,runT=0,TCAD=3,LITE=false,FOGLO=0,FOGHI=0;   /* DPRCAP: most device pixels per pixel; lowered once, to 1.5, when frames stay slow (see governor) */
function gcol(g){var c=GCI[g]||[0,g],p=c[0]?T.quiet:T.pal;return p[c[1]%p.length]}

/* ---------- depth ----------
   In depth the colony (below) is a ball: the notes fill it outward from the read-order notes in the middle. Recency is a rank
   among the notes in view (ties share it), so it spreads evenly whatever the project's pace: recently changed notes reach a
   little further out and glow, the ones untouched for longest are smaller, fainter and without their shine, and a replay grows
   each commit's notes outward. The ball turns about the vertical axis through its centre of mass (or a selected note), like a
   planet. The camera looks from
   slightly above; left alone for a few seconds the network turns slowly, about once a minute, around its centre after Fit, around
   the selected note if there is one, otherwise around the note nearest the middle of the screen (not with reduced motion, and not
   while the pointer rests on a note). A turn keeps its momentum when it is let go, slows to that idle pace and sets its direction
   until the next turn. Panning tilts the view a little; a plain drag (one finger) or a sideways trackpad swipe turns it (Shift-drag,
   right-drag or two fingers moved together pan it instead), all the way round, and tilt it up to about 70 degrees (never over the
   top). The network turns about its own centre; notes fade with their distance from the viewer, so from behind the oldest
   notes are the near, bright ones. Fit (or a double-click) turns it back to the front. With the Depth button off, the
   projection is exactly the flat view. */

   speed in radians per ms (a released turn starts at its own speed); last = time of the last interaction; node = the pivot note
   chosen when the turn started without a selection; samples = recent positions of a turn in progress, for its release speed */

/* Governor for a slow machine. Steps, each taken once and never undone (so nothing can flicker), the next only if the one before was not

if(window.matchMedia){var mq=matchMedia("(prefers-color-scheme: light)"),onSys=function(){if(!root.getAttribute("data-theme"))readTheme()};
  if(mq.addEventListener)mq.addEventListener("change",onSys);else if(mq.addListener)mq.addListener(onSys)}   /* Auto follows a system change */
